# Render Blueprint: New > Blueprint > pick this repo. Free plan, so the disk is ephemeral and the service
# sleeps after 15 minutes without traffic; cached datasets are re-downloaded when it wakes.
services:
  - type: web
    name: dataset-explorer-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ALLOWED_ORIGINS
        value: https://hf-dataset-explorer.vercel.app,https://dataset-explorer-pooyashobbyprojects.vercel.app,http://localhost:8765
      - key: MAX_DATASET_GB
        value: "0.02"
      - key: CACHE_MAX_GB
        value: "3"
      - key: DUCKDB_MEMORY
        value: 160MB
      - key: NODE_OPTIONS
        value: --max-old-space-size=150
      - key: MAX_OPEN_DBS
        value: "1"
      - key: INDEX_CHUNK_ROWS
        value: "500"
      - key: DUCKDB_THREADS
        value: "1"
      - key: MAX_JOBS
        value: "1"
      - key: PRIVATE_TTL_HOURS
        value: "12"
